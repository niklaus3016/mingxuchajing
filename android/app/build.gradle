apply plugin: 'com.android.application'

// 删除有问题的资源文件
task deleteProblematicResources {
    doLast {
        def filesToDelete = [
            // 自适应图标配置
            'src/main/res/drawable/ic_launcher_background.xml',
            'src/main/res/drawable-v24/ic_launcher_foreground.xml',
            'src/main/res/mipmap-anydpi-v26/ic_launcher.xml',
            'src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml',
            // 有问题的 splash 图片
            'src/main/res/drawable/splash.png',
            'src/main/res/drawable-land-hdpi/splash.png',
            'src/main/res/drawable-land-mdpi/splash.png',
            'src/main/res/drawable-land-xhdpi/splash.png',
            'src/main/res/drawable-land-xxhdpi/splash.png',
            'src/main/res/drawable-land-xxxhdpi/splash.png',
            'src/main/res/drawable-port-hdpi/splash.png',
            'src/main/res/drawable-port-mdpi/splash.png',
            'src/main/res/drawable-port-xhdpi/splash.png',
            'src/main/res/drawable-port-xxhdpi/splash.png',
            'src/main/res/drawable-port-xxxhdpi/splash.png'
        ]
        
        filesToDelete.each { filePath ->
            def fileObj = file(filePath)
            if (fileObj.exists()) {
                fileObj.delete()
                println "Deleted: $filePath"
            }
        }
    }
}

// 在构建前执行删除任务
preBuild.dependsOn deleteProblematicResources

android { 
    namespace = "com.mingxuchajing.app" 
    compileSdk = rootProject.ext.compileSdkVersion 
    defaultConfig { 
        applicationId "com.mingxuchajing.app" 
        minSdkVersion rootProject.ext.minSdkVersion 
        targetSdkVersion rootProject.ext.targetSdkVersion 
        versionCode 1 
        versionName "V1.0" 
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner" 
        aaptOptions { 
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps. 
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61 
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' 
        } 
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    // 确保使用AndroidX
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    } 
    
    // 添加签名配置
    signingConfigs {
        release {
            storeFile file('../my-release-key.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: '123456'
            keyAlias System.getenv('KEY_ALIAS') ?: 'mingxuchajing'
            keyPassword System.getenv('KEY_PASSWORD') ?: '123456'
            v1SigningEnabled true
            v2SigningEnabled true
            storeType 'JKS'
        }
    }
    
    buildTypes { 
        release { 
            minifyEnabled false 
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro' 
            signingConfig signingConfigs.release
        } 
    } 
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
